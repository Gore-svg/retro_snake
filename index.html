<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retro Snake</title><link rel="stylesheet" href="style.css"></head><body><main class="game-shell"><div class="phone"><div class="screen"><header class="hud"><span>P1 <b id="score1">00</b></span><span>RETRO SNAKE</span><span>P2 <b id="score2">00</b></span></header><div id="gameBoard" class="game-board"></div><div id="menu" class="overlay"><div class="menu-box"><div class="title">SNAKE</div><button id="onePlayerBtn">1 PLAYER MODE</button><button id="twoPlayerBtn">2 PLAYER MODE</button></div></div><div id="lanMenu" class="overlay hidden"><div class="menu-box"><div class="title small">2 PLAYER MODE</div><p class="warning">ENSURE PLAYERS ARE<br>CONNECTED TO SAME NETWORK</p><button id="createBtn">CREATE PARTY</button><button id="joinBtn">JOIN PARTY</button><button id="backBtn" class="secondary">BACK</button></div></div><div id="partyMenu" class="overlay hidden"><div class="menu-box"><div id="partyTitle" class="title small">PARTY</div><div id="partyCode" class="party-code">-----</div><p id="partyStatus">WAITING...</p><input id="joinCode" maxlength="5" autocomplete="off" placeholder="ENTER CODE"><button id="connectBtn">CONNECT</button><button id="cancelPartyBtn" class="secondary">CANCEL</button></div></div><div id="message" class="overlay hidden"><div class="menu-box"><div id="messageTitle" class="title small">GAME OVER</div><p id="messageText"></p><button id="playAgainBtn">PLAY AGAIN</button><button id="menuBtn" class="secondary">MAIN MENU</button></div></div></div><div class="phone-label">RETRO SNAKE</div></div><p class="hint">W A S D · SPACE START/PAUSE · R RESTART</p><p id="connectionStatus" class="connection-status"></p></main><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script src="script.js"></script></body></html>
